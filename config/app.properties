# =====================================================================
# Real-Time Database Monitor & Alert System - configuration
# Keys and defaults: master context v7, sections 69.1 and 69.3.
# Identical on every team machine (shared local demo account).
# Local throwaway credentials only - never reuse a real password here.
# =====================================================================

# ---- Database (MySQL 8.x, process-owned JDBC connection) ----
db.url=jdbc:mysql://localhost:3306/alert_monitor?useSSL=false&allowPublicKeyRetrieval=true
# If MySQL reports "server time zone value ... is unrecognized", append:
#   &serverTimezone=Asia/Kolkata
# (local zone on purpose - do NOT change it to UTC; displayed timestamps must stay correct)
db.user=alertapp
db.password=alertpass

# ---- TCP broadcast server ----
server.host=localhost
server.port=5050
server.maxClients=10

# ---- Intervals (milliseconds) ----
poll.intervalMs=2000
client.reconnectMs=3000
admin.refreshMs=3000

